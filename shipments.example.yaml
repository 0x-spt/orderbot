# Напоминания об отгрузках в теме «Отгрузочные листы» (SHIPMENTS_THREAD_ID).
# За before_minutes минут до каждой передачи заказов площадке робот пишет, сколько заказов
# с этих складов отдать сегодня. Склады — названия как на экране 1С (как в warehouses.yaml).
# Время — московское, в кавычках. После правки файла перезапустите робота.
before_minutes: 10

# Как показывать склад в сообщении (необязательно; без строки — как в 1С).
names:
  "СЕВЕР": "Север"
  "Склад (восто": "Склад (восток)"

# В субботу и воскресенье эти склады не отгружают: их строк в сообщении нет,
# а время, где не осталось ни одного склада, пропускается целиком.
weekend_skip: ["Главный склад", "ВОСТОК 2", "Склад (восто"]

# Время передачи -> площадка (ozon, yandex) -> склады 1С, в порядке показа.
slots:
  "10:00":
    ozon: ["Главный склад"]
    yandex: ["Главный склад", "СПБ"]
  "12:00":
    ozon: ["Южная,9"]
    yandex: ["Южная,9", "СЕВЕР"]
  "14:00":
    ozon: ["СПБ", "СЕВЕР", "ВОСТОК 2", "Склад (восто"]
    yandex: ["ВОСТОК 2", "Склад (восто"]
