# Labeled crops for `python -m orderbot.screen.calibrate layouts/production-crops.yaml`.
# In digit text each character names one glyph of the crop, left to right.
# "?" skips a glyph, "." is one of the dots of a truncation ellipsis.
# Cell rects are the layout's grid cells: row k of a table is y = 1033 + 38k + 3 .. + 36.
